name: Validate combined manual

on:
  push:
    branches: [audit/combined-manual]

permissions:
  contents: read

concurrency:
  group: combined-manual-preview
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check content and types
        run: npm run check
      - name: Build site and search index
        run: npm run build
      - name: Check local links and heading anchors
        run: python3 scripts/check-doc-links.py
      - name: Upload preview files
        uses: actions/upload-artifact@v7
        with:
          name: docs-preview
          path: dist/
          retention-days: 7
